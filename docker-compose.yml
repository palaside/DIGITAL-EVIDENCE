version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: line_user
      POSTGRES_PASSWORD: line_pass
      POSTGRES_DB: line_paginator
    volumes:
      - pg_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

  dashboard:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://line_user:line_pass@postgres:5432/line_paginator
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./profiles_data:/app/profiles_data
      - ./.cache:/app/.cache
      - ./.chunks:/app/.chunks
    deploy:
      resources:
        limits:
          memory: 2G

  celery_batch_normal:
    build: .
    command: celery -A tasks.celery_app worker --loglevel=info -Q batch -c 8 --max-tasks-per-child=50
    environment:
      DATABASE_URL: postgresql://line_user:line_pass@postgres:5432/line_paginator
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./profiles_data:/app/profiles_data
      - ./.cache:/app/.cache
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G

  celery_batch_high:
    build: .
    command: celery -A tasks.celery_app worker --loglevel=info -Q batch_high -c 4
    environment:
      DATABASE_URL: postgresql://line_user:line_pass@postgres:5432/line_paginator
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./profiles_data:/app/profiles_data

  celery_alerts_sfx:
    build: .
    command: celery -A tasks.celery_app worker --loglevel=info -Q alerts,sfx -c 4
    environment:
      DATABASE_URL: postgresql://line_user:line_pass@postgres:5432/line_paginator
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./outputs:/app/outputs
      - ./profiles_data:/app/profiles_data

  celery_beat:
    build: .
    command: celery -A tasks.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://line_user:line_pass@postgres:5432/line_paginator
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  flower:
    build: .
    command: celery -A tasks.celery_app flower --port=5555 --persistent=True
    ports:
      - "5555:5555"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

volumes:
  pg_data:
  redis_data:
